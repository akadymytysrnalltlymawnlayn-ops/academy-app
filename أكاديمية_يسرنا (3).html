<title>أكاديمية يسرنا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1e293b; --teal:#0ea5e9; --teal-dark:#0284c7; --amber:#f59e0b; --coral:#ef4444; 
  --bg:#f8fafc; --card:#ffffff; --line:#e2e8f0; --text:#0f172a; --text-dim:#64748b; 
  --radius:16px; --shadow:0 1px 3px rgba(0,0,0,0.05); --text-faint:#94a3b8;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',sans-serif;height:100%;overflow-x:hidden;}
h1,h2,h3{font-family:'Cairo',sans-serif;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* Auth Screen Styles */
#authScreen {position:fixed; inset:0; background:var(--bg); z-index:9999; display:flex; align-items:center; justify-content:center; padding:20px;}
.auth-card {background:#fff; padding:30px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.1); width:100%; max-width:400px; text-align:center;}
.auth-input {width:100%; padding:12px; margin-bottom:12px; border:1px solid var(--line); border-radius:10px; font-size:14px;}
.auth-btn {width:100%; padding:12px; background:var(--ink); color:#fff; border:none; border-radius:10px; font-weight:700; font-size:15px; cursor:pointer;}

/* App Layout */
#app{display:none; max-width:1180px;margin:0 auto;padding-top:70px;padding-bottom:20px;min-height:100vh;width:100%;}
.topbar{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow);}
.topbar-inner{max-width:1180px;margin:0 auto;padding:8px 12px;}
.nav-row{display:flex;align-items:center;justify-content:space-between;width:100%;height:40px;}
.brand{display:flex;align-items:center;gap:8px;}
.brand .mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--teal),var(--teal-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;}
.brand-name{font-weight:700;font-size:15px;color:var(--ink);}

/* Connection Indicator Dot */
.status-dot {width:8px; height:8px; border-radius:50%; background:#cbd5e1; margin-right:8px; transition:0.3s;}
.status-dot.online {background:#22c55e; box-shadow:0 0 6px rgba(34,197,94,0.4);}
.status-dot.offline {background:#ef4444;}

.top-nav-tabs{display:flex;justify-content:flex-start;gap:4px;overflow-x:auto;padding-bottom:4px;width:100%;scrollbar-width:none;-webkit-overflow-scrolling: touch;}
.top-nav-tabs::-webkit-scrollbar{display:none;}
.nav-tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:10px;color:var(--text-dim);font-size:10px;border:none;background:transparent;white-space:nowrap;}
.nav-tab svg{width:18px;height:18px;}
.nav-tab.active{background:var(--ink);color:#fff;}

function mapStudent(r){ return {id:r.id, name:r.name, phone:r.phone||'', country:r.country||'', status:r.status, payment:r.payment, subjects:r.subjects||[], teacherIds:r.teacher_ids||[], notes:r.notes||'', archived:!!r.archived}; }

async function loadData(){
  try{
    const [stu, tea, ses, subs, trl] = await Promise.all([
      sb.from('students').select('*'),
      sb.from('teachers').select('*'),
      sb.from('sessions').select('*'),
      sb.from('subjects').select('*').order('created_at'),
      sb.from('trials').select('*').order('created_at', {ascending:false})
    ]);
    if(stu.error) return;
    DATA.students = (stu.data||[]).map(mapStudent);
    DATA.teachers = (tea.data||[]).map(mapTeacher);
    DATA.sessions = (ses.data||[]).map(mapSession);
    DATA.subjects = (subs.data||[]).map(r=>r.name);
    DATA.trials = (trl.data||[]).map(mapTrial);
    setCloudStatus('connected');
  }catch(e){ showToast("تعذر تحميل البيانات"); setCloudStatus('error'); }
  render();
}

function subscribeRealtime(){
  sb.channel('academy-sync')
    .on('postgres_changes', {event:'*', schema:'public', table:'students'}, p=>syncEntity('students', mapStudent, p))
    .on('postgres_changes', {event:'*', schema:'public', table:'teachers'}, p=>syncEntity('teachers', mapTeacher, p))
    .on('postgres_changes', {event:'*', schema:'public', table:'sessions'}, p=>syncEntity('sessions', mapSession, p))
    .on('postgres_changes', {event:'*', schema:'public', table:'trials'}, p=>syncEntity('trials', mapTrial, p))
    .subscribe();
}
function syncEntity(type, mapper, payload){
  const arr = DATA[type];
  if(payload.eventType==='DELETE'){
    const idx = arr.findIndex(x=>x.id===payload.old.id);
    if(idx>-1) arr.splice(idx,1);
  } else {
    const row = mapper(payload.new);
    const idx = arr.findIndex(x=>x.id===row.id);
    if(idx>-1) arr[idx]=row; else arr.push(row);
  }
  render();
}

function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

function waLink(phone, message){
  if(!phone) return "#";
  let p = phone.replace(/[^\d+]/g,'').replace(/^0/,'');
  if(!p.startsWith('+') && !p.startsWith('20')) p = '20'+p;
  p = p.replace('+','');
  return message ? `https://wa.me/${p}?text=${encodeURIComponent(message)}` : `https://wa.me/${p}`;
}

function formatTime12(time24) {
    if (!time24) return '';
    let [hours, minutes] = time24.split(':');
    hours = parseInt(hours, 10);
    const ampm = hours >= 12 ? 'م' : 'ص';
    hours = hours % 12 || 12;
    return `${hours}:${minutes} ${ampm}`;
}

function sessionSlotText(s){

function openGroupLink(link){
  if(!link) return;
  const sep = link.includes('?') ? '&' : '?';
  window.open(`${link}${sep}text=${encodeURIComponent(groupReminderMsg())}`,'_blank');
}

const NAV_ITEMS = [
  {id:'dashboard', label:'الرئيسية', icon:ICON.dash},
  {id:'trials', label:'🎯 الحصص التجريبية', icon:ICON.target},
  {id:'students', label:'الطلاب', icon:ICON.students},
  {id:'schedule_sessions', label:'الجدول', icon:ICON.schedule},
  {id:'teachers', label:'المعلمين', icon:ICON.teachers},
  {id:'payments', label:'المدفوعات', icon:ICON.payments},
  {id:'reports', label:'التقارير', icon:ICON.reports},
  {id:'settings', label:'الإعدادات', icon:ICON.settings},
];

function renderNav(){
  const tn = document.getElementById('topNavTabs');
  tn.innerHTML = NAV_ITEMS.map(n=>`<button class="nav-tab ${ROUTE===n.id?'active':''}" onclick="goTo('${n.id}')">${n.icon}<span>${n.label}</span></button>`).join('');
}
function goTo(route){ 
    ROUTE = route; 
    if(route === 'schedule_sessions') scheduleDay = todayArIdx();
    render(); 
    window.scrollTo(0,0); 
}

function render(){
  renderNav();
  const m = document.getElementById('mainContent');
  if(ROUTE==='dashboard') m.innerHTML = pageDashboard();
  else if(ROUTE==='trials') m.innerHTML = pageTrials();
  else if(ROUTE==='students') m.innerHTML = pageStudents();
  else if(ROUTE==='teachers') m.innerHTML = pageTeachers();
  else if(ROUTE==='schedule_sessions') m.innerHTML = pageScheduleSessions();
  else if(ROUTE==='payments') m.innerHTML = pagePayments();
  else if(ROUTE==='reports') m.innerHTML = pageReports();
  else if(ROUTE==='settings') m.innerHTML = pageSettings();
}

async function saveStudent(id){
  const subjects = [...document.querySelectorAll('.subChk:checked')].map(c=>c.value);
  // Preserve existing teacher links if editing, otherwise empty
  const existingTeacherIds = id ? (DATA.students.find(x=>x.id===id)?.teacherIds || []) : [];
  
  const obj = {
    id: id || uid(),
    name: document.getElementById('f_name').value.trim() || 'بدون اسم',
    phone: document.getElementById('f_phone').value.trim(),
    country: document.getElementById('f_country').value.trim(),
    status: document.getElementById('f_status').value,
    payment: document.getElementById('f_payment').value,
    subjects, 
    teacherIds: existingTeacherIds,
    notes: document.getElementById('f_notes').value.trim(),
    archived: id ? (DATA.students.find(x=>x.id===id)||{}).archived||false : false
  };
  const { error } = await sb.from('students').upsert(studentToDb(obj));
  if(error){ showToast('تعذر الحفظ'); return; }
  const idx = DATA.students.findIndex(x=>x.id===id);
  if(idx>-1) DATA.students[idx]=obj; else DATA.students.push(obj);
  closeModal(); render(); showToast('تم حفظ بيانات الطالب');
}

let selectedTrialTeacherId = '';
let trialSlotCount = 0;
function trialTeacherTypeahead(q){
  const box = document.getElementById('trialTeacherSuggestions');
  q = q.trim(); selectedTrialTeacherId = '';
  if(q.length<2){ box.style.display='none'; box.innerHTML=''; return; }
  const matches = DATA.teachers.filter(t=>!t.archived && t.name.includes(q));
  if(!matches.length){ box.innerHTML = `<div style="padding:8px;font-size:12px;color:var(--text-faint)">لا يوجد نتائج</div>`; box.style.display='block'; return; }
  box.innerHTML = matches.map(t=>`<div style="padding:8px;font-size:12px;cursor:pointer;border-bottom:1px solid #f1f5f9;" onclick="pickTrialTeacher('${t.id}','${t.name.replace(/'/g,"\\'")}')">${esc(t.name)}</div>`).join('');
  box.style.display='block';
}
function pickTrialTeacher(id, name){
  selectedTrialTeacherId = id;
  document.getElementById('f_trTeacherSearch').value = name;
  document.getElementById('trialTeacherSuggestions').style.display='none';
}
function addTrialSlotRow(dateVal, timeVal){
  trialSlotCount++;
  const id = 'trialSlot_'+trialSlotCount;
  const div = document.createElement('div');
  div.className='slot-row'; div.id=id;
  div.innerHTML = `<input type="date" class="trialSlotDate" value="${dateVal||''}"><input type="time" class="trialSlotTime" value="${timeVal||''}"><button type="button" style="background:#fff;color:var(--coral);border:1px solid #fee2e2;border-radius:6px;width:28px;height:28px;" onclick="document.getElementById('${id}').remove()">✕</button>`;
  document.getElementById('trialSlotsContainer').appendChild(div);
}
async function saveTrial(id){
  const existing = id ? DATA.trials.find(x=>x.id===id) : null;
  const newSlots = [...document.querySelectorAll('#trialSlotsContainer .slot-row')]
    .map(row=>({date:row.querySelector('.trialSlotDate').value, time:row.querySelector('.trialSlotTime').value}))
    .filter(sl=>sl.date && sl.time);
  const scheduleTxt = newSlots.length
    ? newSlots.map(sl=>`${new Date(sl.date).toLocaleDateString('ar-EG',{day:'numeric',month:'short'})} ${formatTime12(sl.time)}`).join('، ')
    : (existing ? existing.schedule : '');
  const payload = {
    id: id || uid(),
    studentName: document.getElementById('f_trName').value.trim(),
    phone: document.getElementById('f_trPhone').value.trim(),
    subject: document.getElementById('f_trSubject').value.trim(),
    teacherName: (selectedTrialTeacherId ? (DATA.teachers.find(x=>x.id===selectedTrialTeacherId)||{}).name : document.getElementById('f_trTeacherSearch').value.trim()) || '',
    schedule: scheduleTxt,
    link: document.getElementById('f_trLink').value.trim(),
    status: document.getElementById('f_trStatus').value,
    archived: false
  };
  if(!payload.studentName){ showToast('اكتب اسم الطالب'); return; }
  const { error } = await sb.from('trials').upsert(trialToDb(payload));
  if(error){ showToast('تعذر الحفظ'); return; }
  const idx = DATA.trials.findIndex(x=>x.id===payload.id);
  if(idx>-1) DATA.trials[idx]=payload; else DATA.trials.unshift(payload);
  closeModal();
  if(payload.status==='تم الاشتراك'){
    await doConvertTrial(payload.id);
    goTo('schedule_sessions');
    showToast('🚀 تم الاشتراك، انتقلت الحصة للجدولة');
  } else {
    render();
    showToast('تم الحفظ');
  }
}
async function convertTrialToStudent(id){
  const t = DATA.trials.find(x=>x.id===id); if(!t) return;
  const ok = window.confirm(`تحويل "${t.studentName}" لطالب مشترك في القائمة الأساسية؟`);
  if(!ok) return;
  await doConvertTrial(id);
  showToast('🚀 تم تحويل الطالب بنجاح');
}
async function doConvertTrial(id){
  const t = DATA.trials.find(x=>x.id===id); if(!t || t.archived) return;

  // 1) إنشاء الطالب
  const newStudent = { id: uid(), name:t.studentName, phone:t.phone, country:'', status:'مشترك', payment:'معلق', subjects: t.subject?[t.subject]:[], teacherIds:[], notes: t.schedule?`الموعد التجريبي: ${t.schedule}`:'', archived:false };
  const { error: e1 } = await sb.from('students').insert(studentToDb(newStudent));
  if(e1){ showToast('تعذر إنشاء الطالب'); return; }
  DATA.students.unshift(newStudent);

  // 2) محاولة ربط المعلم لو الاسم متطابق مع معلم موجود
  const matchedTeacher = DATA.teachers.find(x=>!x.archived && x.name.trim()===(t.teacherName||'').trim());
  if(matchedTeacher){ newStudent.teacherIds=[matchedTeacher.id]; await sb.from('students').update({teacher_ids:[matchedTeacher.id]}).eq('id',newStudent.id); }

  // 3) إنشاء حصة في الجدول الأساسي
  const newSession = { id: uid(), studentId:newStudent.id, studentName:newStudent.name, teacherId: matchedTeacher?matchedTeacher.id:null, subjects: t.subject?[t.subject]:[], slots:[], status:'مشترك', link:'', archived:false };
  const { error: e2 } = await sb.from('sessions').insert(sessionToDb(newSession));
  if(!e2){ DATA.sessions.unshift(newSession); }

  // 4) أرشفة الحصة التجريبية القديمة (بدون حذفها نهائيًا، احتياطًا)
  await sb.from('trials').update({archived:true, status:'تم الاشتراك'}).eq('id', t.id);
  t.archived = true; t.status = 'تم الاشتراك';
  render();
}

function renderDaySchedule(){
    const day = DAYS[scheduleDay];
    const daySessions = DATA.sessions.filter(s => !s.archived && s.slots && s.slots.some(sl => sl.day === day));
    daySessions.sort((a, b) => {
        const timeA = a.slots.find(sl => sl.day === day)?.time || '';
        const timeB = b.slots.find(sl => sl.day === day)?.time || '';
        return timeA.localeCompare(timeB);
    });
    return `

function teacherTypeahead(q){
  const box = document.getElementById('teacherSuggestions');
  q = q.trim(); selectedTeacherId = '';
  if(q.length<2){ box.style.display='none'; box.innerHTML=''; return; }
  const matches = DATA.teachers.filter(t=>!t.archived && t.name.includes(q));
  if(!matches.length){ box.innerHTML = `<div style="padding:8px;font-size:12px;color:var(--text-faint)">لا يوجد نتائج</div>`; box.style.display='block'; return; }

}

function addSlotRow(slot){
  slotCount++;
  const id = 'slot_'+slotCount;
  const div = document.createElement('div');
  div.className='slot-row'; div.id=id;
  const dayOpts = DAYS.map(d=>`<option ${slot&&slot.day===d?'selected':''}>${d}</option>`).join('');
  div.innerHTML = `<select class="slotDay">${dayOpts}</select><input type="time" class="slotTime" value="${slot?slot.time||'':''}"><button type="button" style="background:#fff;color:var(--coral);border:1px solid #fee2e2;border-radius:6px;width:28px;height:28px;" onclick="document.getElementById('${id}').remove()">✕</button>`;
  document.getElementById('slotsContainer').appendChild(div);
}
function normalizePhoneDigits(p){ return (p||'').replace(/\D/g,'').replace(/^0+/,''); }
async function upsertStudentFromSession(name, phone){
  if(!name) return '';
  let existing = null;
  if(phone) existing = DATA.students.find(x=>!x.archived && x.phone && normalizePhoneDigits(x.phone)===normalizePhoneDigits(phone));
  if(!existing) existing = DATA.students.find(x=>!x.archived && x.name.trim().toLowerCase()===name.toLowerCase());
  if(existing){
    existing.name = name;
    if(phone) existing.phone = phone;
    await sb.from('students').upsert(studentToDb(existing));
    return existing.id;
  }
  const newStudent = { id: uid(), name, phone, country:'', status:'تجريبي', payment:'معلق', subjects:[], teacherIds: selectedTeacherId?[selectedTeacherId]:[], notes:'', archived:false };
  const { error } = await sb.from('students').upsert(studentToDb(newStudent));
  if(error) return '';
  DATA.students.push(newStudent);
  return newStudent.id;
}
async function saveSession(id){
  const slots = [...document.querySelectorAll('.slot-row')].map(row=>({
    day: row.querySelector('.slotDay').value,
    time: row.querySelector('.slotTime').value
  })).filter(sl=>sl.time);
  const studentNameVal = document.getElementById('f_sStudent').value.trim();
  const studentPhoneVal = document.getElementById('f_sStudentPhone').value.trim();

  // إضافة جديدة (بدون id) = تتسجل كحصة تجريبية ومتظهرش في الجدولة إلا بعد الاشتراك
  if(!id){
    if(!studentNameVal){ showToast('اكتب اسم الطالب'); return; }
    const teacherObj = DATA.teachers.find(x=>x.id===selectedTeacherId);
    const scheduleTxt = slots.map(sl=>`${sl.day} ${formatTime12(sl.time)}`).join('، ');
    const statusMap = {'تجريبية':'مجدولة','مشترك':'تم الاشتراك','متوقف':'لم يشترك'};
    const formStatus = document.getElementById('f_sStatus').value;
    const trialPayload = {
      id: uid(),
      studentName: studentNameVal,
      phone: studentPhoneVal,
      subject: [...sSubjects].join('، '),
      teacherName: teacherObj ? teacherObj.name : '',
      schedule: scheduleTxt,
      status: statusMap[formStatus] || 'مجدولة',
      link: document.getElementById('f_sLink').value.trim(),
      archived: false
    };
    const { error } = await sb.from('trials').upsert(trialToDb(trialPayload));
    if(error){ showToast('تعذر الحفظ'); return; }
    DATA.trials.unshift(trialPayload);
    closeModal();
    if(trialPayload.status==='تم الاشتراك'){
      await doConvertTrial(trialPayload.id);
      goTo('schedule_sessions');
      showToast('🚀 تم الاشتراك، انتقلت الحصة للجدولة');
    } else {
      goTo('trials');
      showToast('تم الحفظ في الحصص التجريبية');
    }
    return;
  }

  // تعديل حصة موجودة بالفعل في الجدولة (السلوك القديم زي ما هو)
  const studentId = await upsertStudentFromSession(studentNameVal, studentPhoneVal);
  
  // AUTOMATED TEACHER LINKING LOGIC
  if(selectedTeacherId && studentId) {
      const stu = DATA.students.find(x=>x.id===studentId);
      if(stu && !stu.teacherIds.includes(selectedTeacherId)) {
          stu.teacherIds.push(selectedTeacherId);
          await sb.from('students').update({teacher_ids: stu.teacherIds}).eq('id', studentId);
      }
  }

  const obj = {
    id: id,
    studentId,
    studentName: studentNameVal,
    teacherId: selectedTeacherId,
    subjects: [...sSubjects],
    slots,
    status: document.getElementById('f_sStatus').value,
    link: document.getElementById('f_sLink').value.trim(),
    archived: (DATA.sessions.find(x=>x.id===id)||{}).archived||false
  };
  const { error } = await sb.from('sessions').upsert(sessionToDb(obj));
  if(error){ showToast('تعذر الحفظ'); return; }
  const idx = DATA.sessions.findIndex(x=>x.id===id);
  if(idx>-1) DATA.sessions[idx]=obj; else DATA.sessions.push(obj);
  closeModal();
  render();
  showToast('تم الحفظ');
}

  const pending = list.filter(s=>s.payment==='معلق').length;
  return `
    <h1 class="page-title">المدفوعات</h1>
    <div class="stat-row" style="grid-template-columns:repeat(3,1fr);">
      <div class="stat-card"><div class="num">${paid}</div><div class="lbl">تم الدفع</div></div>
      <div class="stat-card"><div class="num">${unpaid}</div><div class="lbl">لم يتم</div></div>
      <div class="stat-card"><div class="num">${pending}</div><div class="lbl">معلق</div></div>
    </div>
    <div class="list">
      ${list.map(s=>`<div class="p-card">
        <div class="p-top">
          <div class="avatar">${s.name?s.name[0]:'ط'}</div>
          <div><div class="p-name">${s.name}</div></div>
          <select onchange="quickPayment('${s.id}', this.value)" class="badge ${s.payment==='تم الدفع'?'b-paid':s.payment==='لم يتم الدفع'?'b-unpaid':'b-pending'}" style="border:none;">
            ${['تم الدفع','لم يتم الدفع','معلق'].map(o=>`<option ${s.payment===o?'selected':''}>${o}</option>`).join('')}
          </select>
        </div>
      </div>`).join('') || `<div class="empty">لا يوجد طلاب</div>`}
    </div>
  `;
}
async function quickPayment(id, val){
  const s = DATA.students.find(x=>x.id===id); if(!s) return;
  const { error } = await sb.from('students').update({payment:val}).eq('id',id);
  if(error){ showToast('تعذر التحديث'); return; }
  s.payment = val; render(); showToast('تم التحديث');
}

function pageReports(){
  const s = DATA.students.filter(x=>!x.archived);
  const sess = DATA.sessions.filter(x=>!x.archived);
  const total = sess.length;
  const activeRate = total ? Math.round((sess.filter(x=>x.status==='مشترك').length/total)*100) : 0;

  const sessBreak = ['تجريبية','مشترك','متوقف'].map(st=>({label:st, count: sess.filter(x=>x.status===st).length}));
  const payBreak = [
    {label:'تم الدفع', count: s.filter(x=>x.payment==='تم الدفع').length, color:'#15803d'},
    {label:'لم يتم الدفع', count: s.filter(x=>x.payment==='لم يتم الدفع').length, color:'#b91c1c'},
    {label:'معلق', count: s.filter(x=>x.payment==='معلق').length, color:'#b45309'},
  ];

  const bar = (label,count,total,color)=>`
    <div style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;"><span>${label}</span><span style="color:var(--text-dim)">${count}</span></div>
      <div style="height:8px;background:#f1f5f9;border-radius:4px;overflow:hidden;"><div style="height:100%;background:${color};border-radius:4px;width:${total?Math.round((count/total)*100):0}%"></div></div>
    </div>`;

  return `
    <h1 class="page-title">التقارير</h1>
    <div class="stat-row">
      <div class="stat-card accent"><div class="num">${s.length}</div><div class="lbl">إجمالي الطلاب</div></div>
      <div class="stat-card"><div class="num">${DATA.teachers.filter(t=>!t.archived).length}</div><div class="lbl">المعلمين</div></div>
      <div class="stat-card"><div class="num">${total}</div><div class="lbl">إجمالي الحصص</div></div>
      <div class="stat-card"><div class="num">${activeRate}%</div><div class="lbl">نسبة الاشتراك</div></div>
    </div>
    <div style="background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--line);">
      <h4 style="margin:0 0 12px;font-size:14px;font-weight:700;">حالة الحصص</h4>
      ${sessBreak.map(x=>bar(x.label,x.count,total,x.label==='مشترك'?'linear-gradient(90deg,var(--teal),var(--teal-dark))':x.label==='متوقف'?'#ef4444':'#f59e0b')).join('')}
    </div>
    <div style="background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--line);">
      <h4 style="margin:0 0 12px;font-size:14px;font-weight:700;">حالة المدفوعات</h4>
      ${payBreak.map(x=>bar(x.label,x.count,s.length,x.color)).join('')}
    </div>
  `;
}

function pageSettings(){
  return `
    <h1 class="page-title">الإعدادات</h1>
    <div style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow);">
      <h4 style="margin:0 0 10px;font-size:14px;font-weight:700;">المواد الدراسية</h4>
      ${DATA.subjects.map((s,i)=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px;"><span>${s}</span><button style="background:none;border:none;color:var(--coral);font-size:12px;" onclick="removeSubject(${i})">حذف</button></div>`).join('') || '<div style="color:var(--text-faint);font-size:12px;">لا توجد مواد</div>'}
      <div style="display:flex;gap:6px;margin-top:8px;"><input id="newSubject" placeholder="مادة جديدة" style="flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;"><button onclick="addSubject()" style="background:var(--ink);color:#fff;border:none;padding:8px 12px;border-radius:8px;">إضافة</button></div>
    </div>
    <div style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow);">
      <h4 style="margin:0 0 10px;font-size:14px;font-weight:700;">نسخة احتياطية</h4>
      <div style="display:flex;gap:8px;">
        <button class="icon-btn" style="flex:1" onclick="exportData()">تصدير JSON</button>
        <label class="icon-btn" style="flex:1;text-align:center;">استيراد<input type="file" accept=".json" style="display:none" onchange="importData(event)"></label>
      </div>
    </div>
    <div style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow);">
      <button class="icon-btn" style="width:100%;background:#fee2e2;color:#b91c1c;font-weight:700;" onclick="handleLogout()">تسجيل خروج</button>
    </div>
  `;
}
async function addSubject(){
  const v = document.getElementById('newSubject').value.trim();
  if(!v || DATA.subjects.includes(v)) return;
  const { error } = await sb.from('subjects').insert({name:v});
  if(error){ showToast('تعذرت الإضافة'); return; }
  DATA.subjects.push(v); render();
}
async function removeSubject(i){
  const name = DATA.subjects[i];
  const { error } = await sb.from('subjects').delete().eq('name', name);
  if(error){ showToast('تعذر الحذف'); return; }
  DATA.subjects.splice(i,1); render();
}
function exportData(){
  const blob = new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'yusrana-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      showToast('جاري النقل...');
      const isUuid = v => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v||'');
      const idMap = {};
      const remap = old => { if(!old) return old; if(!idMap[old]) idMap[old] = isUuid(old) ? old : uid(); return idMap[old]; };
      const students = (parsed.students||[]).map(s=>({...s, id:remap(s.id), teacherIds:(s.teacherIds||[]).map(remap)}));
      const teachers = (parsed.teachers||[]).map(t=>({...t, id:remap(t.id)}));
      const sessions = (parsed.sessions||[]).map(s=>({...s, id:remap(s.id), studentId:remap(s.studentId), teacherId:remap(s.teacherId)}));
      if(students.length) await sb.from('students').upsert(students.map(studentToDb));
      if(teachers.length) await sb.from('teachers').upsert(teachers.map(teacherToDb));
      if(sessions.length) await sb.from('sessions').upsert(sessions.map(sessionToDb));
      if(parsed.subjects && parsed.subjects.length) await sb.from('subjects').upsert(parsed.subjects.map(name=>({name})), {onConflict:'name'});
      await loadData();
      showToast('تم النقل بنجاح');
    }catch(err){ showToast('ملف غير صالح'); }
  };
  reader.readAsText(file);
}

async function toggleArchive(type, id){
  const arr = DATA[type];
  const item = arr.find(x=>x.id===id);
  if(!item) return;
  const newVal = !item.archived;
  const { error } = await sb.from(type).update({archived:newVal}).eq('id',id);
  if(error){ showToast('تعذر التحديث'); return; }
  item.archived = newVal; render(); showToast(newVal?'تم الأرشفة':'تم الاستعادة');
}

async function deleteRecord(type, id, label){
  const ok = window.confirm(`هل أنت متأكد من حذف ${label||'هذا العنصر'} نهائيًا؟ لا يمكن التراجع عن هذا الإجراء.`);
  if(!ok) return;
  const { error } = await sb.from(type).delete().eq('id', id);
  if(error){ showToast('تعذر الحذف'); return; }
  DATA[type] = DATA[type].filter(x=>x.id!==id);
  render();
  closeModal();
  showToast('تم الحذف نهائيًا');
}

function openModal(){ document.getElementById('modalBg').classList.add('show'); }
function closeModal(){ document.getElementById('modalBg').classList.remove('show'); }
document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') closeModal(); });

const searchInput = document.getElementById('globalSearch');
const searchResultsBox = document.getElementById('globalSearchResults');
searchInput.addEventListener('input', ()=>{
  const q = searchInput.value.trim().toLowerCase();
  if(q.length < 1){ searchResultsBox.style.display='none'; searchResultsBox.innerHTML=''; return; }
  const studentMatches = DATA.students.filter(s=>!s.archived && ((s.name||'').toLowerCase().includes(q) || (s.phone||'').includes(q)));
  const teacherMatches = DATA.teachers.filter(t=>!t.archived && ((t.name||'').toLowerCase().includes(q) || (t.phone||'').includes(q)));
  const sessionMatches = DATA.sessions.filter(se=>!se.archived && (
    (se.studentName||'').toLowerCase().includes(q) ||
    ((DATA.teachers.find(x=>x.id===se.teacherId)||{}).name||'').toLowerCase().includes(q) ||
    (se.subjects||[]).some(su=>(su||'').toLowerCase().includes(q))
  ));
  const trialMatches = DATA.trials.filter(t=>!t.archived && (
    (t.studentName||'').toLowerCase().includes(q) ||
    (t.teacherName||'').toLowerCase().includes(q) ||
    (t.subject||'').toLowerCase().includes(q) ||
    (t.phone||'').includes(q)
  ));
  if(!studentMatches.length && !teacherMatches.length && !sessionMatches.length && !trialMatches.length){
    searchResultsBox.innerHTML = `<div style="padding:10px;font-size:12px;color:var(--text-faint);text-align:center;">لا يوجد نتائج</div>`;
    searchResultsBox.style.display='block';
    return;
  }
  const row = (label, sub, icon, onclick) => `<div style="padding:8px 10px;font-size:12px;display:flex;align-items:center;gap:8px;cursor:pointer;border-bottom:1px solid #f1f5f9;" onclick="${onclick}">${icon}<span>${esc(label)}${sub?`<small style="display:block;color:var(--text-dim);font-size:10px;">${esc(sub)}</small>`:''}</span></div>`;
  let html = '';
  if(trialMatches.length){
    html += `<div style="padding:6px 10px;font-size:10px;color:var(--text-dim);background:#f8fafc;">🎯 حصص تجريبية</div>`;
    html += trialMatches.slice(0,5).map(t=>row(t.studentName, t.teacherName, '🎯', `goTo('trials');closeSearch();openTrialModal('${t.id}')`)).join('');
  }
  if(studentMatches.length){
    html += `<div style="padding:6px 10px;font-size:10px;color:var(--text-dim);background:#f8fafc;">طلاب</div>`;
    html += studentMatches.slice(0,5).map(s=>row(s.name, s.phone, '👤', `goTo('students');closeSearch();openStudentModal('${s.id}')`)).join('');
  }
  if(teacherMatches.length){
    html += `<div style="padding:6px 10px;font-size:10px;color:var(--text-dim);background:#f8fafc;">معلمين</div>`;
    html += teacherMatches.slice(0,5).map(t=>row(t.name, t.phone, '🧑‍🏫', `goTo('teachers');closeSearch();openTeacherModal('${t.id}')`)).join('');
  }
  if(sessionMatches.length){
    html += `<div style="padding:6px 10px;font-size:10px;color:var(--text-dim);background:#f8fafc;">حصص</div>`;
    html += sessionMatches.slice(0,5).map(se=>row(se.studentName, (se.subjects||[]).join('، '), '📅', `goTo('schedule_sessions');closeSearch();openSessionDetails('${se.id}')`)).join('');
  }
  searchResultsBox.innerHTML = html;
  searchResultsBox.style.display='block';
});
function closeSearch(){ searchResultsBox.style.display='none'; searchInput.value=''; }
document.addEventListener('click', e=>{
  if(!searchInput.contains(e.target) && !searchResultsBox.contains(e.target)) searchResultsBox.style.display='none';
});

</script>
